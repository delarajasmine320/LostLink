{% extends 'base.html' %}{% block content %}<small>STAFF WORKSPACE</small><h1>Claim requests</h1>{% for c in claims %}<section class="panel claim"><span class="tag">{{ c.status }}</span><h3>{{ c.item_name }}</h3><p>Claimant: {{ c.claimant }}</p><p>{{ c.ownership_details }}</p>{% if c.status=='pending' %}<form method="post" action="{{ url_for('decide_claim',cid=c.id,decision='approved') }}"><button>Approve</button></form><form method="post" action="{{ url_for('decide_claim',cid=c.id,decision='rejected') }}"><button class="red">Reject</button></form>{% endif %}</section>{% else %}<p>No claims yet.</p>{% endfor %}{% endblock %}

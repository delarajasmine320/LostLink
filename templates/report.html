{% extends 'base.html' %}{% block content %}<form class="panel form wide" method="post" enctype="multipart/form-data"><small>ITEM REPORT</small><h1>Report a {{ kind }} item</h1><label>Item name<input name="item_name" required></label><label>Category<select name="category" required><option value="">Choose</option>{% for c in ['Identification Card','Electronics','Bags','Clothing','Accessories','Books and School Supplies','Keys','Umbrellas','Others'] %}<option>{{ c }}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="4" required></textarea></label><label>Location<input name="location" required placeholder="e.g. Library, second floor"></label><label>Date {{ kind }}<input type="date" name="incident_date" required></label><label>Photo (optional)<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label><button>Submit report</button></form>{% endblock %}
